# docker-compose.debug.yml
# Levanta la API con Delve para debug remoto desde VS Code.
#
# IMPORTANTE: Detener el stack de dev antes de levantar este:
#   make dev-down
#   make debug
# Luego conectar desde VS Code: Run & Debug → Go: Docker (Delve remoto)

services:
  api:
    build:
      context: .
      target: debug
      dockerfile: Dockerfile
    # Mismo nombre que dev para que nginx lo encuentre por hostname
    container_name: kali-invoice-api-dev
    env_file: .env.dev
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_SSLMODE=disable
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
      - "127.0.0.1:40000:40000"   # Puerto de Delve (solo localhost)
    volumes:
      - .:/app
      - /app/tmp
      - /app/vendor
    security_opt:
      - apparmor:unconfined    # Necesario para Delve en Linux
    cap_add:
      - SYS_PTRACE             # Necesario para Delve
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kali-debug-net

  db:
    image: postgres:16-alpine
    container_name: kali-invoice-db-debug
    environment:
      POSTGRES_USER: ${DB_USER:-kali_dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kali_dev_pass_change_me}
      POSTGRES_DB: ${DB_NAME:-kali_invoices_dev}
    ports:
      - "5432:5432"   # Mantener puerto externo estable entre dev/debug
    volumes:
      - kali-debug-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kali_dev} -d ${DB_NAME:-kali_invoices_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kali-debug-net

networks:
  kali-debug-net:
    driver: bridge

volumes:
  kali-debug-db-data:
