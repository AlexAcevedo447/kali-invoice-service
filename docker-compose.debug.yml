# docker-compose.debug.yml
# Levanta la API con Delve para debug remoto desde VS Code.
#
# Uso (desde este repo):
#   make debug        # quita SOLO los contenedores de dev (sin borrar volúmenes) y levanta este stack
#   make debug-down   # quita los contenedores de debug y restaura dev
# Luego conectar desde VS Code: Run & Debug → Go: Docker (Delve remoto, 127.0.0.1:40000)
#
# Es el mismo proyecto Compose que docker-compose.dev.yml (mismo directorio) y usa
# los mismos nombres de servicio (invoice-api, db) y la misma red (kali-dev-net),
# así el frontend en Docker lo encuentra por el hostname invoice-api. Dev y debug
# no pueden convivir: publican los mismos puertos (8080 y 5432).
#
# La base de debug usa su propio volumen (kali-debug-db-data) y sus propias
# credenciales (DB_USER/DB_PASSWORD/DB_NAME, con valores por defecto de
# desarrollo); la API recibe esas mismas credenciales como POSTGRES_*, que es lo
# que lee internal/infrastructure/config/config.go.

services:
  invoice-api:
    build:
      context: .
      target: debug
      dockerfile: Dockerfile
    container_name: kali-invoice-api-debug
    env_file: .env.dev
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${DB_USER:-kali_dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kali_dev_pass_change_me}
      POSTGRES_DB: ${DB_NAME:-kali_invoices_dev}
      POSTGRES_SSLMODE: disable
      RABBITMQ_ENABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
      - "127.0.0.1:40000:40000"   # Puerto de Delve (solo localhost)
    volumes:
      - .:/app
      - /app/tmp
      - /app/vendor
    security_opt:
      - apparmor:unconfined    # Necesario para Delve en Linux
    cap_add:
      - SYS_PTRACE             # Necesario para Delve
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${APP_PORT:-8080}/api/v1/metrics >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - kali-dev-net

  db:
    image: postgres:16-alpine
    container_name: kali-invoice-db-debug
    environment:
      POSTGRES_USER: ${DB_USER:-kali_dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kali_dev_pass_change_me}
      POSTGRES_DB: ${DB_NAME:-kali_invoices_dev}
    ports:
      - "5432:5432"   # Mantener puerto externo estable entre dev/debug
    volumes:
      - kali-debug-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kali_dev} -d ${DB_NAME:-kali_invoices_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kali-dev-net

networks:
  kali-dev-net:
    name: kali-dev-net
    driver: bridge

volumes:
  kali-debug-db-data:
