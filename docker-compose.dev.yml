services:
  # ========== API SERVICE ==========
  api:
    build:
      context: .
      target: dev
      dockerfile: Dockerfile
    container_name: kali-invoice-api-dev
    image: kali-invoice:dev-${APP_PORT:-8080}
    env_file: .env.dev
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    volumes:
      - .:/app
      - /app/tmp  # Excluir tmp del bind mount
      - /app/vendor  # Excluir vendor del bind mount
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kali-dev-net
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=api"

  # ========== DATABASE ==========
  db:
    image: postgres:16-alpine
    container_name: kali-invoice-db-dev
    env_file:
      - ${APP_ENV_FILE:-.env.dev}
    ports:
      - "5432:5432"
    volumes:
      - kali-dev-db-data:/var/lib/postgresql/data
      - ./scripts/pg-healthcheck.sh:/app/scripts/pg-healthcheck.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "/app/scripts/pg-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kali-dev-net
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=db"

  # ========== OPTIONAL: ADMINER (DB GUI) ==========
  # Levantar solo cuando se necesite: docker compose --profile tools up adminer
  adminer:
    image: adminer:4.8.1
    container_name: kali-invoice-adminer-dev
    profiles:
      - tools
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - db
    networks:
      - kali-dev-net
    # Las variables de entorno de Adminer se toman del archivo .env.dev
    restart: on-failure

networks:
  kali-dev-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  kali-dev-db-data:
    driver: local
