services:
  # ========== API SERVICE ==========
  api:
    build:
      context: .
      target: dev
      dockerfile: Dockerfile
    container_name: kali-invoice-api-dev
    image: kali-invoice:dev-${APP_PORT:-8080}
    env_file: .env.dev
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_SSLMODE=disable
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    volumes:
      - .:/app
      - /app/tmp  # Excluir tmp del bind mount
      - /app/vendor  # Excluir vendor del bind mount
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kali-dev-net
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=api"

  # ========== DATABASE ==========
  db:
    image: postgres:16-alpine
    container_name: kali-invoice-db-dev
    environment:
      POSTGRES_USER: ${DB_USER:-kali_dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kali_dev_pass_change_me}
      POSTGRES_DB: ${DB_NAME:-kali_invoices_dev}
    ports:
      - "5432:5432"
    volumes:
      - kali-dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kali_dev} -d ${DB_NAME:-kali_invoices_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kali-dev-net
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=db"

  # ========== OPTIONAL: ADMINER (DB GUI) ==========
  # Levantar solo cuando se necesite: docker compose --profile tools up adminer
  adminer:
    image: adminer:4.8.1
    container_name: kali-invoice-adminer-dev
    profiles:
      - tools
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - db
    networks:
      - kali-dev-net
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    restart: on-failure

networks:
  kali-dev-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  kali-dev-db-data:
    driver: local
