
services:
  api:
    build:
      context: .
      target: prod # Usa la etapa prod del Dockerfile
    container_name: kali-invoice-prod
    env_file: .env
    ports:
      - "${APP_PORT}:${APP_PORT}"
    restart: always
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: kali-invoice-db-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - kali_invoice_data:/var/lib/postgresql/data
    restart: always

volumes:
  kali_invoice_data:
