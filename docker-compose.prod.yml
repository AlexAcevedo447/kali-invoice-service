services:
  # ========== API SERVICE (PROD) ==========
  api:
    build:
      context: .
      target: prod
      dockerfile: Dockerfile
    container_name: kali-invoice-api
    image: kali-invoice:prod
    env_file: .env.prod
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - kali-prod-net
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=api,env=prod"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${APP_PORT:-8080}/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ========== DATABASE (PROD) ==========
  db:
    image: postgres:16-alpine
    container_name: kali-invoice-db
    # Las variables de entorno de la base de datos se toman del archivo .env.prod
    volumes:
      - kali-prod-db-data:/var/lib/postgresql/data
      - ./scripts/pg-healthcheck.sh:/app/scripts/pg-healthcheck.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "/app/scripts/pg-healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - kali-prod-net
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=db,env=prod"

  # ========== RABBITMQ (OPTIONAL FOR PROD) ==========
  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: kali-invoice-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: kali_user
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change_me}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - kali-prod-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - kali-prod-net
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=rabbitmq,env=prod"

networks:
  kali-prod-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/16

volumes:
  kali-prod-db-data:
    driver: local
  kali-prod-rabbitmq-data:
    driver: local
